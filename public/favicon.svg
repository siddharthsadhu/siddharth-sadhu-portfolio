<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#181124" />
      <stop offset="100%" stop-color="#07050A" />
    </radialGradient>

    <!-- 5-Leaf Clover Anti-Magic Energy Gradient -->
    <linearGradient id="cloverGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="25%" stop-color="#C026D3" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Central Demon Spark / Core Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA8E8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="antiMagicAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Badge Container with Rounded Corners -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="30" stroke="url(#cloverGrad)" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- 5-Leaf Clover Geometry (5 distinct heart-shaped clover petals radiating symmetrically at 72° angles) -->
  <g filter="url(#antiMagicAura)" transform="translate(64, 60)">
    
    <!-- Leaf 1: Top (0°) -->
    <g transform="rotate(0)">
      <path d="M0,0 C-14,-14 -22,-32 -10,-42 C-2,-48 0,-38 0,-34 C0,-38 2,-48 10,-42 C22,-32 14,-14 0,0 Z" 
            fill="url(#cloverGrad)" />
      <path d="M0,-5 L0,-36" stroke="#FFA8E8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Leaf 2: Top Right (72°) -->
    <g transform="rotate(72)">
      <path d="M0,0 C-14,-14 -22,-32 -10,-42 C-2,-48 0,-38 0,-34 C0,-38 2,-48 10,-42 C22,-32 14,-14 0,0 Z" 
            fill="url(#cloverGrad)" />
      <path d="M0,-5 L0,-36" stroke="#FFA8E8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Leaf 3: Bottom Right (144°) -->
    <g transform="rotate(144)">
      <path d="M0,0 C-14,-14 -22,-32 -10,-42 C-2,-48 0,-38 0,-34 C0,-38 2,-48 10,-42 C22,-32 14,-14 0,0 Z" 
            fill="url(#cloverGrad)" />
      <path d="M0,-5 L0,-36" stroke="#FFA8E8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Leaf 4: Bottom Left (216°) -->
    <g transform="rotate(216)">
      <path d="M0,0 C-14,-14 -22,-32 -10,-42 C-2,-48 0,-38 0,-34 C0,-38 2,-48 10,-42 C22,-32 14,-14 0,0 Z" 
            fill="url(#cloverGrad)" />
      <path d="M0,-5 L0,-36" stroke="#FFA8E8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Leaf 5: Top Left (288°) — The Legendary 5th Leaf -->
    <g transform="rotate(288)">
      <path d="M0,0 C-14,-14 -22,-32 -10,-42 C-2,-48 0,-38 0,-34 C0,-38 2,-48 10,-42 C22,-32 14,-14 0,0 Z" 
            fill="url(#cloverGrad)" />
      <path d="M0,-5 L0,-36" stroke="#FFA8E8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Clover Stem (Graceful curved trailing stem down right) -->
    <path d="M0,0 Q-4,28 14,46 Q16,48 12,48 Q-8,30 -2,0 Z" fill="url(#cloverGrad)" opacity="0.95" />

    <!-- Central Nexus Demon Core -->
    <circle cx="0" cy="0" r="14" fill="url(#coreGlow)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" opacity="0.9" />

    <!-- 4 Diagonal Micro Spark Orbs -->
    <circle cx="-16" cy="-16" r="1.5" fill="#FFA8E8" opacity="0.8" />
    <circle cx="18" cy="-14" r="1.5" fill="#F43F5E" opacity="0.8" />
    <circle cx="16" cy="18" r="1.2" fill="#C026D3" opacity="0.8" />
    <circle cx="-18" cy="14" r="1.2" fill="#818CF8" opacity="0.8" />
  </g>
</svg>
