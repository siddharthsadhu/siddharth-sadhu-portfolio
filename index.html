
<!DOCTYPE html>

    <meta charset="UTF-8" />

    <title>Siddharth Sadhu | Architectural Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: {
                dark: '#0A0A0B',
                light: '#FBFBFC'
              },
              surface: {
                dark: 'rgba(255, 255, 255, 0.03)',
                light: 'rgba(255, 255, 255, 1)'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        transition: background-color 0.5s ease, color 0.5s ease;
        background-color: #0A0A0B;
        color: #F9FAFB;
        overflow-x: hidden;
      }
      .dark body {
        background-color: #0A0A0B;
        color: #F9FAFB;
      }
      .light body {
        background-color: #FBFBFC;
        color: #1A1A1B;
      }
      .glass-effect {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      .dark ::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.2); border-radius: 10px; }
      .light ::-webkit-scrollbar-thumb { background: rgba(109, 40, 217, 0.15); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(167, 139, 250, 0.4); }
    </style>
